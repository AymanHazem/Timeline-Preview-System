spring.application.name=TimelinePreviewSystem
server.port=${PORT:8080}

# Load .env file as optional external configuration
spring.config.import=optional:file:.env[.properties]

app.upload-dir=${UPLOAD_DIR:uploads}
app.output-dir=${OUTPUT_DIR:outputs}
app.frame-interval=${FRAME_INTERVAL:5}
app.sprite.thumbnail-width=160
app.sprite.thumbnail-height=90
app.sprite.columns=10

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:100MB}